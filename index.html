                const unsubExp = db.collection(`${pathBase}/expenses`).onSnapshot(snap => {

                const unsubItin = db.collection(`${pathBase}/itinerary`).onSnapshot(snap => {
                    setItineraryData(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { unsubExp(); unsubItin(); };

            useEffect(() => {

                                <h1 className="text-4xl font-black text-slate-800 kuromi-font tracking-tight">福岡 2026</h1>
                                <div className="flex items-center gap-3 mt-3">
                                    <div className="flex -space-x-2">{members.map(m => (<div key={m} className="w-8 h-8 rounded-full border-2 border-white kuromi-gradient flex items-center justify-center text-[9px] text-white font-black shadow-sm">{m[0]}</div>))}</div>
                                    <span className="text-[10px] text-slate-300 font-bold uppercase tracking-widest italic">SHEN FAMILY TRIP</span>
                                </div>
                            </div>
                            <div onClick={() => setIsWeatherModalOpen(true)} className="bg-purple-50 p-4 rounded-3xl text-center min-w-[100px] border border-purple-100 float-anim cursor-pointer active:scale-90 transition-all shadow-sm">
                                <Icon name={weather.loading ? 'refresh' : 'cloud-sun'} size={32} className={`mx-auto mb-1 ${weather.loading ? 'animate-spin' : 'text-purple-400'}`} />
                                <p className="text-2xl font-black text-purple-600">{weather.temp}°C</p>
                                <p className="text-[9px] text-purple-300 font-bold uppercase">Fukuoka</p>
                            </div>
                        </div>
                        <div className="mt-8 bg-slate-50 p-5 rounded-3xl flex items-center justify-between border border-slate-100">
                             <div className="flex items-center gap-3"><Icon name="sparkles" size={16} className="text-pink-400" /><span className="text-sm font-bold text-slate-600">冒險倒數</span></div>
                             <span className="text-2xl font-black text-pink-400">{countdownDays} <span className="text-xs text-slate-300 font-bold uppercase">Days</span></span>
                        </div>
                    </header>

                    <nav className="flex bg-white/90 backdrop-blur-md sticky top-0 z-50 px-4 py-2 border-b border-slate-100 mb-6 shadow-sm overflow-x-auto hide-scrollbar">
                        {['itinerary', 'map', 'expense', 'tools'].map(t => (
                            <button key={t} onClick={() => { setActiveTab(t); setItineraryView('list'); }} className={`flex-1 min-w-[80px] py-5 font-black transition-all ${activeTab === t ? 'tab-active' : 'text-slate-300'}`}>
                                {t === 'itinerary' ? '行程' : t === 'map' ? '地圖' : t === 'expense' ? '記帳' : '工具'}
                            </button>
                        ))}
                    </nav>

                    <div className="px-6 pb-20">
                        {/* 1. 行程分頁 */}
                        {activeTab === 'itinerary' && (
                            itineraryView === 'list' ? (
                                <div className="space-y-6 animate-in fade-in">
                                    <h2 className="text-2xl font-black text-slate-800 italic underline decoration-chic-purple decoration-4 underline-offset-4">行程總覽 🗺️</h2>
                                    <div className="grid grid-cols-1 gap-4">
                                        {dates.map((day, idx) => (
                                            <div key={day.date} onClick={() => { setSelectedDayIdx(idx); setItineraryView('detail'); }} className="chic-card p-6 flex items-center gap-6 active:bg-purple-50 transition-all cursor-pointer group">
                                                <div className="w-16 h-16 rounded-3xl kuromi-gradient flex flex-col items-center justify-center text-white shadow-lg group-active:scale-90 transition-transform">
                                                    <span className="text-[10px] font-bold opacity-60 uppercase">{day.dayName}</span>
                                                    <span className="text-3xl font-black">{day.date.split('/')[1]}</span>
                                                </div>
                                                <div className="flex-1">
                                                    <p className="text-xs font-bold text-slate-300 mb-1">DATE: {day.date}</p>
                                                    {/* 🛠️ 顯示自定義的每日標題 */}
                                                    <p className="text-xl font-black text-slate-700 leading-tight">{day.title}</p>
                                                </div>
                                                <Icon name="chevron-right" size={24} className="text-slate-200" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-8 animate-in slide-in-from-bottom">
                                    <div className="flex items-center gap-4"><button onClick={() => setItineraryView('list')} className="p-4 bg-white rounded-full shadow-md text-slate-400 active:scale-75 transition-all"><Icon name="chevron-left" size={24} /></button><div><h2 className="text-3xl font-black text-slate-800 tracking-tighter">{dates[selectedDayIdx].date}</h2><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest tracking-tighter">PLAN DETAILS</p></div></div>
                                    <div className="relative pl-10 space-y-12">
                                        {currentDayPlans.map((plan, i) => (
                                            <div key={plan.id} className="timeline-item relative">
                                                <div className="timeline-line"></div>
                                                <div className={`absolute -left-[48px] top-2 w-10 h-10 rounded-full border-4 border-white shadow-md z-10 flex items-center justify-center ${plan.isStatic || plan.type==='fixed' ? 'bg-pink-400' : 'bg-indigo-400'}`}>
                                                    <Icon name={plan.type==='fixed' ? 'plane' : 'heart'} size={16} className="text-white" />
                                                </div>
                                                <div className="chic-card p-6 border-l-8" style={{ borderLeftColor: plan.isStatic||plan.type==='fixed' ? '#FF91C1' : '#85A5FF' }}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-sm font-black text-slate-400">{plan.time}</span>
                                                        <div className="flex gap-3">
                                                            <button onClick={(e) => { e.stopPropagation(); setEditingPlan(plan); setEditPlanBuffer({time:plan.time, title:plan.title, type:plan.type}); setIsEditingPlan(true); }} className="text-slate-200 hover:text-purple-400 active:scale-75 transition-all"><Icon name="pencil" size={16}/></button>
                                                            {!plan.isStatic && <button onClick={(e) => confirmDelete(e, plan.id)} className="text-slate-200 hover:text-red-400 active:scale-75 transition-all"><Icon name="trash" size={16}/></button>}
                                                        </div>
                                                    </div>
                                                    <h3 className="text-xl font-black text-slate-700 leading-tight mb-4">{plan.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { setEditingPlan(null); setEditPlanBuffer({time:'', title:'', type: 'attraction'}); setIsEditingPlan(true); }} className="w-full bg-white border-2 border-dashed border-slate-200 text-slate-400 py-8 rounded-[40px] flex items-center justify-center gap-3 active:bg-slate-50 transition-all font-black text-xl"><Icon name="plus" size={24} /> 新增行程點</button>
                                </div>
                            )
                        )}

                        {/* 2. 地圖分頁 */}
                        {activeTab === 'map' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-2xl font-black text-slate-800 italic underline decoration-chic-purple decoration-4 underline-offset-4">福岡景點地圖 📍</h2>
                                <button onClick={() => window.open('https://maps.app.goo.gl/3yBGjjqpevzTECGB9', '_blank')} className="w-full bg-slate-900 text-white p-10 rounded-[45px] shadow-2xl flex items-center justify-between border-4 border-white active:scale-95 transition-all">
                                    <div className="text-left"><p className="text-3xl font-black mb-1 text-white">開啟 Google Map</p><p className="text-[11px] font-bold opacity-40 uppercase tracking-widest text-white italic tracking-tighter">Open My Saved List 💜</p></div>
                                    <div className="bg-chic-purple p-4 rounded-full shadow-lg"><Icon name="navigation" size={24} className="text-white" /></div>
                                </button>
                                <div className="bg-purple-50/50 p-12 rounded-[50px] border-2 border-dashed border-purple-200 italic font-bold text-purple-400 text-center text-lg leading-relaxed shadow-inner">
                                    點擊上方按鈕<br/>直接查看我幫大家<br/>整理好的福岡熱點清單 💜
                                </div>
                            </div>
                        )}

                        {/* 3. 記帳分頁 */}
                        {activeTab === 'expense' && (
                            <div className="space-y-8 animate-in fade-in">
                                {/* 支出統計卡片 */}
                                <div className="bg-[#2D2727] text-white p-10 rounded-[50px] shadow-2xl space-y-6 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-10 opacity-10 rotate-12"><Icon name="coins" size={180}/></div>
                                    <p className="text-[11px] font-black uppercase tracking-[0.3em] text-[#FF91C1]">總花費統計 (JPY)</p>
                                    <div className="relative z-10">
                                        <p className="text-6xl font-black tracking-tighter mb-1">¥{totalExpenseJpy.toLocaleString()}</p>
                                        <p className="text-xl font-bold text-[#FF91C1] opacity-90">≈ NT$ {totalExpenseTwd.toLocaleString()}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 pt-6 border-t border-white/10">
                                        {members.map(m => {
                                            const pTotal = expenses.filter(e => e.payer === m).reduce((s, e) => s + (e.amount || 0), 0);
                                            return (
                                                <div key={m} className="flex flex-col"><span className="text-[9px] font-bold text-slate-500 uppercase">{m} 支付</span><span className="font-bold text-sm">¥{pTotal.toLocaleString()}</span></div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white rounded-[45px] p-8 space-y-6 shadow-xl border-4 border-purple-50">
                                    <h3 className="text-xl font-black underline decoration-pink-300 decoration-4">快速記帳與換算 🍴</h3>
                                    <div className="space-y-4 relative z-10">
                                        <div className="flex items-center gap-4 border-b border-slate-100 pb-3"><span className="text-3xl font-black opacity-20 w-8 text-center">¥</span><input type="number" value={fxJpy} onChange={(e) => { setFxJpy(e.target.value); setFxTwd(e.target.value ? Math.round(e.target.value * exchangeRate) : ''); }} placeholder="0" className="flex-1 bg-transparent text-5xl font-black focus:outline-none placeholder:text-slate-100" /></div>
                                        <div className="flex items-center gap-4 pt-2"><span className="text-3xl font-black text-pink-300 w-8 text-center">$</span><input type="number" value={fxTwd} onChange={(e) => { setFxTwd(e.target.value); setFxJpy(e.target.value ? Math.round(e.target.value / exchangeRate) : ''); }} placeholder="0" className="flex-1 bg-transparent text-5xl font-black text-pink-300 focus:outline-none placeholder:text-pink-100" /></div>
                                    </div>
                                    <button onClick={addExpense} disabled={isSaving || !fxJpy} className="w-full kuromi-gradient text-white py-5 rounded-[35px] font-black text-xl shadow-lg active:scale-95 disabled:opacity-50">同步至雲端明細 💜</button>
                                </div>

                                <div className="space-y-4 pb-12">
                                    {expenses.map(ex => (
                                        <div key={ex.id} className="chic-card p-6 flex justify-between items-center border-l-[14px] border-chic-purple transition-all active:scale-95 shadow-sm">
                                            <div className="flex-1 mr-4"><div className="flex items-center gap-3 mb-1.5"><span className="text-[10px] font-black text-white bg-slate-800 px-3 py-1 rounded-lg uppercase tracking-wider">{ex.payer}</span><span className="text-[10px] text-slate-300 font-bold tracking-tighter">{ex.date}</span></div><p className="text-xl font-black text-slate-700">{ex.item}</p></div>
                                            <div className="text-right flex items-center gap-4"><div><p className="text-2xl font-black text-slate-800 mb-0.5">¥{ex.amount?.toLocaleString()}</p><p className="text-[10px] font-black text-pink-400">NT$ {ex.amountTwd?.toLocaleString()}</p></div><button onClick={() => db.collection(`artifacts/${appId}/public/data/expenses`).doc(ex.id).delete()} className="p-2 text-slate-200 hover:text-red-400 active:scale-75 transition-all"><Icon name="trash" size={18}/></button></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. 工具分頁 */}
                        {activeTab === 'tools' && (
                            <div className="space-y-12 animate-in fade-in pb-24">
                                {/* 優惠卷區 */}
                                <section>
                                    <div className="flex items-center gap-4 chic-card p-7 mb-10 border-b-[12px] border-chic-orange shadow-xl">
                                        <Icon name="ticket" size={32} className="text-chic-orange" />
                                        <p className="text-xl font-black text-slate-700">優惠卷專區 📂</p>
                                    </div>
                                    <div className="space-y-4">
                                        {couponList.map((c, i) => (
                                            <div key={i} onClick={() => window.open(c.link, '_blank')} className="chic-card p-6 flex items-center justify-between active:bg-orange-50 cursor-pointer group transition-all">
                                                <div className="flex items-center gap-4"><Icon name="folder" size={24} className="text-orange-200 group-hover:text-orange-400 transition-colors" /><span className="font-bold text-lg text-slate-600 tracking-tight">{c.category}</span></div>
                                                <Icon name="chevron-right" size={24} className="text-slate-200" />
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                {/* 飯店與地圖 */}
                                <div className="chic-card p-10 border-[6px] border-purple-100 text-center relative overflow-hidden bg-white shadow-xl">
                                    <Icon name="hotel" size={40} className="text-purple-200 mx-auto mb-2" />
                                    <h3 className="text-3xl font-black text-slate-800 mb-1 leading-tight tracking-tighter">博多西鐵 CROOM 🏨</h3>
                                    <p className="text-[10px] text-slate-400 font-black mb-8 uppercase tracking-[0.2em]">博多祇園櫛田神社前</p>
                                    <div className="flex gap-4"><button onClick={() => window.open('https://maps.app.goo.gl/hotel','_blank')} className="flex-1 kuromi-gradient text-white py-5 rounded-[30px] font-black text-sm shadow-md active:scale-95 transition-all text-white">地圖定位</button><a href="tel:092-235-0311" className="flex-1 border-4 border-slate-900 py-5 rounded-[30px] font-black text-lg text-slate-900 flex items-center justify-center active:scale-95 transition-all">撥打電話</a></div>
                                </div>

                                {/* 快速入口 */}
                                <section>
                                    <div className="flex items-center gap-3 mb-6 px-1"><Icon name="luggage" size={24} className="text-purple-400" /><h3 className="text-2xl font-black text-slate-800 underline decoration-pink-300 decoration-4 underline-offset-4 tracking-tighter">快速資源 💜</h3></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => window.open('https://vjw-lp.digital.go.jp/','_blank')} className="chic-card p-6 flex flex-col items-center justify-center gap-2 active:scale-95 transition-all shadow-sm">
                                            <div className="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-blue-400"><Icon name="refresh" size={24}/></div>
                                            <span className="font-bold text-sm text-slate-500 uppercase tracking-tighter">Visit Japan</span>
                                        </button>
                                        <button onClick={() => window.open('https://photos.google.com','_blank')} className="chic-card p-6 flex flex-col items-center justify-center gap-2 active:scale-95 transition-all shadow-sm">
                                            <div className="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center text-pink-400"><Icon name="image" size={24}/></div>
                                            <span className="font-bold text-sm text-slate-500 uppercase tracking-tighter">Family Album</span>
                                        </button>
                                    </div>
                                </section>

                                {/* 行理檢查表 */}
                                <section className="space-y-4 pb-10">
                                    <h3 className="text-xl font-black text-slate-800 flex items-center gap-3 px-2 italic underline decoration-purple-100 decoration-8 underline-offset-[-2px]">行李檢查清單 💼</h3>
                                    {['護照/身分證/VJW QR碼', '日幣/信用卡/保險單', '換洗衣物/好走的鞋', '相機/行動電源/充電線', 'Ruby 藥品/尿布/副食品'].map(item => (
                                        <div key={item} onClick={() => setPackingItems(prev => ({...prev, [item]: !prev[item]}))} className={`chic-card p-5 flex items-center gap-5 transition-all active:scale-95 cursor-pointer shadow-sm ${packingItems[item] ? 'opacity-40 grayscale bg-slate-50' : ''}`}>
                                            <div className={`w-8 h-8 rounded-xl border-4 flex items-center justify-center transition-all ${packingItems[item] ? 'bg-purple-400 border-transparent' : 'border-purple-50'}`}>
                                                {packingItems[item] && <Icon name="check" className="text-white" size={18} />}
                                            </div>
                                            <span className={`font-black text-lg text-slate-600 ${packingItems[item] ? 'line-through' : ''}`}>{item}</span>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                    </div>

                    {/* 天氣預報 Modal */}
                    {isWeatherModalOpen && (
                        <div className="fixed inset-0 z-[120] modal-mask flex items-center justify-center p-8">
                            <div className="bg-white w-full rounded-[60px] p-10 shadow-2xl space-y-6 animate-in slide-in-from-bottom duration-300 max-h-[80vh] overflow-y-auto hide-scrollbar border-b-[15px] border-chic-purple">
                                <div className="flex justify-between items-center mb-4"><h3 className="text-3xl font-black text-slate-800 italic underline decoration-chic-purple decoration-4">福岡週報 🌦️</h3><button onClick={() => setIsWeatherModalOpen(false)} className="p-3 text-slate-300 active:scale-75 transition-all"><Icon name="x" size={32} /></button></div>
                                <div className="space-y-4">{(forecast || []).map((f, i) => (<div key={i} className="flex items-center justify-between p-6 bg-slate-50 rounded-[40px] shadow-sm"><div className="flex items-center gap-5"><span className="text-xl font-black text-slate-400 w-16 tracking-tighter">{f.date}</span><Icon name="cloud-sun" size={32} className="text-chic-purple" /></div><div className="flex items-center gap-4"><span className="text-3xl font-black text-slate-700 leading-none">{f.max}°</span><div className="w-px h-8 bg-slate-200"></div><span className="text-3xl font-black text-slate-300 leading-none">{f.min}°</span></div></div>))}</div>
                                <button onClick={() => setIsWeatherModalOpen(false)} className="w-full kuromi-gradient text-white py-6 rounded-[40px] font-black text-2xl shadow-xl mt-4 active:scale-95 transition-all text-white shadow-purple-200">關閉 💜</button>
                            </div>
                        </div>
                    )}

                    {/* 編輯計畫 Modal */}
                    {isEditingPlan && (
                        <div className="fixed inset-0 z-[110] modal-mask flex items-center justify-center p-8">
                            <div className="bg-white w-full rounded-[60px] p-10 shadow-2xl space-y-10 animate-in zoom-in border-t-[15px] border-chic-purple">
                                <h3 className="text-3xl font-black text-slate-800 text-center kuromi-font tracking-tight">{editingPlan ? '修改計畫 ✏️' : '新增計畫 ✏️'}</h3>
                                <div className="space-y-8 text-left">
                                    <div className="space-y-4">
                                        <label className="text-xs font-black text-slate-400 ml-4 uppercase tracking-[0.3em] block">預計時間 (如 14:30)</label>
                                        <input value={editPlanBuffer.time} onChange={(e) => setEditPlanBuffer({...editPlanBuffer, time: e.target.value})} className="w-full bg-slate-50 rounded-[35px] p-7 text-4xl font-black border-4 border-transparent focus:border-purple-100 outline-none transition-all shadow-inner" />
                                        <label className="text-xs font-black text-slate-400 ml-4 uppercase tracking-[0.3em] block">計畫內容</label>
                                        <input value={editPlanBuffer.title} onChange={(e) => setEditPlanBuffer({...editPlanBuffer, title: e.target.value})} className="w-full bg-slate-50 rounded-[35px] p-7 text-2xl font-black border-4 border-transparent focus:border-purple-100 outline-none transition-all shadow-inner" />
                                    </div>
                                </div>
                                <div className="flex gap-4 pt-2">
                                    <button onClick={savePlan} disabled={isSaving} className="flex-1 kuromi-gradient text-white py-6 rounded-[40px] font-black text-2xl shadow-xl active:scale-95 transition-all">{isSaving ? "同步中..." : "確認儲存 💜"}</button>
                                    <button onClick={() => { setIsEditingPlan(false); setEditingPlan(null); }} className="px-10 bg-slate-100 text-slate-400 rounded-[40px] font-black active:scale-95 transition-all text-lg">取消</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <div className="fixed bottom-0 left-0 right-0 h-4 kuromi-gradient z-[60]"></div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
