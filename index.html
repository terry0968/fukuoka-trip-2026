<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>福岡 2026 | SHEN 家族大冒險</title>

    <!-- 核心庫：由 CDN 載入，確保瀏覽器能直接執行 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (相容版) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --chic-purple: #9D76C1;
            --chic-purple-light: #F3F0F8;
            --chic-pink: #FF91C1;
            --chic-orange: #FFB085;
            --chic-blue: #85A5FF;
            --chic-bg: #FDFCFE;
            --chic-dark: #2D2727;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--chic-bg); 
            color: var(--chic-dark);
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 118, 193, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 145, 193, 0.05) 0%, transparent 20%);
        }

        .kuromi-font { font-family: 'ZCOOL KuaiLe', cursive; }
        .kuromi-gradient { background: linear-gradient(135deg, #9D76C1 0%, #765898 100%); }
        
        .chic-card { 
            background: white; 
            border-radius: 32px; 
            box-shadow: 0 12px 40px rgba(157, 118, 193, 0.08);
            border: 1px solid rgba(157, 118, 193, 0.12);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .chic-card:active { transform: scale(0.97); }

        /* 垂直時間軸導航線 - 更精緻的樣式 */
        .timeline-line {
            position: absolute;
            left: 32px;
            top: 48px;
            bottom: -32px;
            width: 2px;
            background: linear-gradient(to bottom, var(--chic-purple) 0%, #E2D9F3 50%, #E2D9F3 100%);
            opacity: 0.5;
            z-index: 0;
        }
        .timeline-item:last-child .timeline-line { display: none; }

        .tab-active { color: var(--chic-purple); position: relative; font-weight: 900; }
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 50%; width: 24px; height: 4px;
            transform: translateX(-50%);
            background: var(--chic-purple); border-radius: 10px;
            box-shadow: 0 2px 10px rgba(157, 118, 193, 0.4);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .modal-mask {
            background-color: rgba(45, 39, 39, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .float-anim { animation: floating 4s ease-in-out infinite; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        .btn-gradient {
            background: linear-gradient(135deg, #9D76C1 0%, #8561A8 100%);
            box-shadow: 0 8px 20px rgba(157, 118, 193, 0.3);
        }
        
        .expense-card-dark {
            background: linear-gradient(145deg, #2D2727 0%, #1A1616 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCAb0qAoOh0A88-wuRz-Gk_cU5f2vIOd3c",
            authDomain: "fukuoka-2026.firebaseapp.com",
            projectId: "fukuoka-2026",
            storageBucket: "fukuoka-2026.firebasestorage.app",
            messagingSenderId: "545717934606",
            appId: "1:545717934606:web:0d6ba3dd86addc76a77a5f"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "fukuoka-2026";

        // --- 圖標組件 ---
        const Icon = ({ name, className = "", size = 24 }) => {
            const icons = {
                'heart': "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.505 4.04 3 5.5L12 21l7-7Z",
                'cloud-sun': "M12 2v2M4.22 4.22l1.42 1.42M1 12h2M4.22 19.78l1.42-1.42M12 20v2M18.36 18.36l1.42-1.42M23 12h-2M18.36 5.64l1.42 1.42M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z",
                'navigation': "M3 11l19-9-9 19-2-8-8-2z",
                'plus': "M12 5v14M5 12h14",
                'chevron-left': "M15 18l-6-6 6-6",
                'chevron-right': "M9 18l6-6-6-6",
                'pencil': "M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z",
                'trash': "M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2",
                'refresh': "M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8 M21 3v5h-5 M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16 M3 21v-5h5",
                'ticket': "M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z",
                'folder': "M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z",
                'plane': "M22 16.21v-1.89L14.84 9.9 14.84 4a1.5 1.5 0 0 0-3 0v5.9L4.67 14.32v1.89l7.17-2.73v5.13l-1.71 1.14v1.33l3.37-1.01 3.37 1.01v-1.33l-1.71-1.14v-5.13L22 16.21z",
                'luggage': "M3 14h18M7 21h10M3 7h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z",
                'hotel': "M3 21V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12M7 11h2M7 15h2M15 11h2M15 15h2M11 21v-4a1 1 0 0 1 1-1h0a1 1 0 0 1 1 1v4",
                'x': "M18 6L6 18M6 6l12 12",
                'coins': "M11 15h2M12 12V3c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v1h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6c0-1.1.9-2 2-2h1V3c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v9Z",
                'sparkles': "M12 3l1.912 5.886L21 10.8l-5.176 3.914L17.738 21 12 17.114 6.262 21l1.914-6.286L3 10.8l7.088-1.914L12 3z",
                'image': "M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z M8.5 10a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z M21 15l-5-5L5 21",
                'check': "M20 6L9 17l-5-5",
                'wallet': "M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1M16 12h5"
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={`${className} pointer-events-none transition-all`}>
                    <path d={icons[name] || ""} />
                </svg>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('itinerary'); 
            const [itineraryView, setItineraryView] = useState('list');
            const [selectedDayIdx, setSelectedDayIdx] = useState(0);
            const [itineraryData, setItineraryData] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [isEditingPlan, setIsEditingPlan] = useState(false);
            const [editingPlan, setEditingPlan] = useState(null);
            const [editPlanBuffer, setEditPlanBuffer] = useState({ time: '', title: '', type: 'attraction' });
            const [fxJpy, setFxJpy] = useState('');
            const [fxTwd, setFxTwd] = useState('');
            const exchangeRate = 0.211;
            const [isSaving, setIsSaving] = useState(false);
            const [toast, setToast] = useState({ show: false, msg: '' });
            const [isConfirmModal, setIsConfirmModal] = useState({ show: false, id: null });
            const [weather, setWeather] = useState({ temp: '--', code: 0, loading: true });
            const [forecast, setForecast] = useState([]);
            const [isWeatherModalOpen, setIsWeatherModalOpen] = useState(false);
            const [packingItems, setPackingItems] = useState({});

            const members = ['KCY', 'Ruby', 'YSL', 'Tsai'];
            
            const dates = [
                { date: '5/30', dayName: 'SAT', title: '抵達日' },
                { date: '5/31', dayName: 'SUN', title: '假日踏青' },
                { date: '6/01', dayName: 'MON', title: '海洋探險' },
                { date: '6/02', dayName: 'TUE', title: 'LALAPORT一日遊' },
                { date: '6/03', dayName: 'WED', title: '歷史知性之旅' },
                { date: '6/04', dayName: 'THU', title: '天神商圈血拼' },
                { date: '6/05', dayName: 'FRI', title: '在地精華與美食' },
                { date: '6/06', dayName: 'SAT', title: '滿載而歸' }
            ];

            const DEFAULT_PLANS = {
                '5/30': [
                    { time: '14:40', title: '華航 CI128 出發 ✈️', type: 'fixed' },
                    { time: '18:05', title: '抵達福岡機場 🛬', type: 'fixed' },
                    { time: '19:30', title: '飯店 Check-in 🏨', type: 'attraction' },
                    { time: '20:00', title: '晚餐時間 🍴', type: 'attraction' }
                ],
                '5/31': [
                    { time: '10:30', title: '大濠公園 🌳', type: 'attraction' },
                    { time: '12:30', title: 'MARK IS 美食街 🍴', type: 'attraction' },
                    { time: '17:00', title: '福岡塔登塔 🗼', type: 'attraction' },
                    { time: '19:30', title: '燒肉 One Karubi 🥩', type: 'attraction' }
                ],
                '6/01': [
                    { time: '10:00', title: '海之中道海洋世界 🐬', type: 'attraction' },
                    { time: '14:00', title: '海之中道海濱公園 🌳', type: 'attraction' },
                    { time: '19:00', title: '博多車站拉麵 🍜', type: 'attraction' }
                ],
                '6/02': [
                    { time: '09:30', title: 'LaLaport 福岡 (鋼彈) 🤖', type: 'attraction' },
                    { time: '14:00', title: '阿卡將母嬰購物 🛍️', type: 'attraction' },
                    { time: '19:00', title: '博多牛腸鍋 🥘', type: 'attraction' }
                ],
                '6/03': [
                    { time: '10:30', title: '太宰府天滿宮 ⛩️', type: 'attraction' },
                    { time: '13:30', title: '九州國立博物館 🏺', type: 'attraction' },
                    { time: '18:30', title: '和牛まぶし 🥩', type: 'attraction' }
                ],
                '6/04': [
                    { time: '10:30', title: '天神地下街血拼 🛍️', type: 'attraction' },
                    { time: '18:30', title: '博多華味鳥水炊鍋 🥘', type: 'attraction' }
                ],
                '6/05': [
                    { time: '09:30', title: '櫛田神社 & 川端通 ⛩️', type: 'attraction' },
                    { time: '11:30', title: '大東園燒肉午餐 🥩', type: 'attraction' },
                    { time: '17:00', title: '烤雞皮居酒屋 🍻', type: 'attraction' }
                ],
                '6/06': [
                    { time: '10:30', title: '博多車站伴手禮 🛒', type: 'attraction' },
                    { time: '15:30', title: '前往機場 🚕', type: 'fixed' },
                    { time: '19:10', title: 'CI129 返程 ✈️', type: 'fixed' }
                ]
            };

            const couponList = [
                { category: '藥妝優惠 💊', link: 'https://drive.google.com/drive/folders/15tPJsxMOt83LFnWM2rW8H7E2MjupTphA' },
                { category: '電器服飾 👟', link: 'https://drive.google.com/drive/folders/1A-rowM9WMfok8cG4FhvpCc-N6bhuBcrj' },
                { category: '百貨機場 🛫', link: 'https://drive.google.com/drive/folders/1JEuQ0ysYEatA9yJR4H2-6KotCT7oClp1_' }
            ];

            const countdownDays = useMemo(() => {
                const target = new Date('2026-05-30T00:00:00');
                const now = new Date();
                const diff = target.getTime() - now.getTime();
                return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
            }, []);

            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(u => {
                    if (u) setUser(u);
                    else auth.signInAnonymously().catch(e => console.error(e));
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = `artifacts/${appId}/public/data`;
                const unsubExp = db.collection(`${pathBase}/expenses`).onSnapshot(snap => {
                    setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.date||"").localeCompare(a.date||"")));
                });
                const unsubItin = db.collection(`${pathBase}/itinerary`).onSnapshot(snap => {
                    setItineraryData(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { unsubExp(); unsubItin(); };
            }, [user]);

            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.5902&longitude=130.4017&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo');
                        const data = await res.json();
                        setWeather({ temp: Math.round(data.current_weather.temperature), code: data.current_weather.weathercode, loading: false });
                        setForecast(data.daily.time.map((t, idx) => ({ date: t.split('-').slice(1).join('/'), max: Math.round(data.daily.temperature_2m_max[idx]), min: Math.round(data.daily.temperature_2m_min[idx]), code: data.daily.weathercode[idx] })));
                    } catch (e) { setWeather(prev => ({ ...prev, loading: false })); }
                };
                fetchWeather();
            }, []);

            const currentDayPlans = useMemo(() => {
                const day = dates[selectedDayIdx];
                if (!day) return [];
                const target = day.date;
                const cloud = itineraryData.filter(p => p.targetDate === target);
                const cloudIds = new Set(cloud.map(p => p.id));
                const staticPlans = (DEFAULT_PLANS[target] || [])
                    .map(p => ({ ...p, id: `static-${target.replace('/', '-')}-${p.time.replace(':', '-')}`, isStatic: true }))
                    .filter(p => !cloudIds.has(p.id));
                return [...cloud, ...staticPlans].sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
            }, [itineraryData, selectedDayIdx]);

            const showToast = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 3000); };

            const savePlan = async () => {
                if (!editPlanBuffer.time || !editPlanBuffer.title || !user) return;
                setIsSaving(true);
                try {
                    const id = editingPlan ? editingPlan.id : `plan-${Date.now()}`;
                    await db.collection(`artifacts/${appId}/public/data/itinerary`).doc(id).set({
                        ...editPlanBuffer, targetDate: dates[selectedDayIdx].date, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    setIsEditingPlan(false); setEditingPlan(null); showToast("同步成功 💜");
                } finally { setIsSaving(false); }
            };

            const executeDelete = async () => {
                if (!isConfirmModal.id) return;
                await db.collection(`artifacts/${appId}/public/data/itinerary`).doc(isConfirmModal.id).delete();
                setIsConfirmModal({ show: false, id: null });
                showToast("已從雲端移除");
            };

            const addExpense = async () => {
                if (!fxJpy || !user) return;
                setIsSaving(true);
                try {
                    await db.collection(`artifacts/${appId}/public/data/expenses`).add({
                        payer: 'KCY', item: '旅遊開銷', amount: parseFloat(fxJpy), amountTwd: Math.round(parseFloat(fxJpy) * exchangeRate), date: new Date().toISOString().split('T')[0]
                    });
                    setFxJpy(''); setFxTwd(''); showToast("記帳成功 💜");
                } finally { setIsSaving(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-28">
                    
                    {/* 確認彈窗 */}
                    {isConfirmModal.show && (
                        <div className="fixed inset-0 z-[300] modal-mask flex items-center justify-center p-8">
                            <div className="bg-white/95 w-full rounded-[48px] p-10 text-center shadow-2xl space-y-6 animate-in zoom-in border border-white/20">
                                <Icon name="trash" size={64} className="mx-auto text-red-400 opacity-80" />
                                <h3 className="text-2xl font-bold text-slate-800 leading-tight">確定要移除<br/>這項計畫嗎？</h3>
                                <div className="flex gap-4">
                                    <button onClick={executeDelete} className="flex-1 bg-red-500 text-white py-5 rounded-[24px] font-bold shadow-lg active:scale-95 transition-all">確定</button>
                                    <button onClick={() => setIsConfirmModal({show:false, id:null})} className="flex-1 bg-slate-100 text-slate-400 py-5 rounded-[24px] font-bold active:scale-95 transition-all">取消</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast */}
                    <div className={`fixed top-10 left-1/2 -translate-x-1/2 z-[200] transition-all duration-500 ${toast.show ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-12 pointer-events-none'}`}>
                        <div className="bg-white/90 text-slate-800 px-8 py-4 rounded-full flex items-center gap-3 shadow-2xl border border-purple-100 backdrop-blur-md">
                            <Icon name="heart" size={20} className="text-pink-400 fill-pink-400" />
                            <span className="font-bold tracking-tight text-lg">{toast.msg}</span>
                        </div>
                    </div>

                    <header className="bg-white/80 backdrop-blur-xl px-8 pt-16 pb-10 rounded-b-[60px] shadow-sm relative overflow-hidden border-b border-purple-50">
                        <div className="absolute -top-10 -right-10 opacity-[0.03] rotate-12"><Icon name="heart" size={300} className="text-purple-600" /></div>
                        <div className="flex justify-between items-start relative z-10">
                            <div className="space-y-1">
                                <h1 className="text-5xl font-black text-slate-800 kuromi-font tracking-tighter mb-2">福岡 2026</h1>
                                <div className="flex items-center gap-3">
                                    <div className="flex -space-x-3">
                                        {members.map(m => (<div key={m} className="w-10 h-10 rounded-full border-2 border-white kuromi-gradient flex items-center justify-center text-[10px] text-white font-black shadow-sm">{m[0]}</div>))}
                                    </div>
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] italic">Adventure</span>
                                </div>
                            </div>
                            <div onClick={() => setIsWeatherModalOpen(true)} className="bg-white p-5 rounded-[36px] text-center min-w-[110px] border border-purple-100 shadow-sm float-anim cursor-pointer active:scale-90 transition-all">
                                <Icon name={weather.loading ? 'refresh' : 'cloud-sun'} size={36} className={`mx-auto mb-1 ${weather.loading ? 'animate-spin' : 'text-purple-400'}`} />
                                <p className="text-3xl font-black text-purple-600 leading-none mb-1">{weather.temp}°</p>
                                <p className="text-[9px] text-purple-300 font-bold uppercase tracking-widest">Fukuoka</p>
                            </div>
                        </div>
                        <div className="mt-10 bg-purple-50/50 p-6 rounded-[32px] flex items-center justify-between border border-purple-100 shadow-inner">
                             <div className="flex items-center gap-4"><Icon name="sparkles" size={24} className="text-pink-400" /><span className="text-base font-bold text-slate-600">冒險倒數</span></div>
                             <div className="text-right">
                                <span className="text-4xl font-black text-pink-400 tracking-tighter">{countdownDays}</span>
                                <span className="text-[10px] text-slate-300 font-black uppercase ml-1">Days left</span>
                             </div>
                        </div>
                    </header>

                    <nav className="flex glass-nav sticky top-0 z-50 px-4 py-3 mb-8 shadow-sm overflow-x-auto hide-scrollbar border-b border-purple-50/50">
                        {['itinerary', 'map', 'expense', 'tools'].map(t => (
                            <button key={t} onClick={() => { setActiveTab(t); setItineraryView('list'); }} className={`flex-1 min-w-[90px] py-4 font-bold transition-all duration-300 text-base ${activeTab === t ? 'tab-active' : 'text-slate-300 hover:text-slate-400'}`}>
                                {t === 'itinerary' ? '計畫' : t === 'map' ? '地點' : t === 'expense' ? '記帳' : '更多'}
                            </button>
                        ))}
                    </nav>

                    <div className="px-6 pb-20">
                        {/* 1. 行程分頁 */}
                        {activeTab === 'itinerary' && (
                            itineraryView === 'list' ? (
                                <div className="space-y-8 animate-in fade-in duration-500">
                                    <h2 className="text-3xl font-black text-slate-800 italic flex items-center gap-3"><span className="w-2 h-8 kuromi-gradient rounded-full"></span>冒險地圖 🗺️</h2>
                                    <div className="grid grid-cols-1 gap-5">
                                        {dates.map((day, idx) => (
                                            <div key={day.date} onClick={() => { setSelectedDayIdx(idx); setItineraryView('detail'); }} className="chic-card p-6 flex items-center gap-6 group">
                                                <div className="w-20 h-20 rounded-[35px] kuromi-gradient flex flex-col items-center justify-center text-white shadow-xl group-active:scale-90 transition-transform">
                                                    <span className="text-[11px] font-bold opacity-70 uppercase mb-0.5">{day.dayName}</span>
                                                    <span className="text-4xl font-black">{day.date.split('/')[1]}</span>
                                                </div>
                                                <div className="flex-1 space-y-1">
                                                    <p className="text-[10px] font-black text-purple-300 uppercase tracking-widest">DATE: {day.date}</p>
                                                    <p className="text-2xl font-black text-slate-700 leading-tight">{day.title}</p>
                                                </div>
                                                <Icon name="chevron-right" size={28} className="text-slate-200" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-8 animate-in slide-in-from-bottom duration-500">
                                    <div className="flex items-center gap-5">
                                        <button onClick={() => setItineraryView('list')} className="p-5 bg-white rounded-full shadow-lg text-slate-400 active:scale-75 transition-all border border-slate-50"><Icon name="chevron-left" size={32} /></button>
                                        <div>
                                            <h2 className="text-4xl font-black text-slate-800 tracking-tighter">{dates[selectedDayIdx].date}</h2>
                                            <p className="text-[11px] font-black text-purple-300 uppercase tracking-[0.3em]">{dates[selectedDayIdx].title}</p>
                                        </div>
                                    </div>
                                    <div className="relative pl-12 space-y-14">
                                        {currentDayPlans.map((plan, i) => (
                                            <div key={plan.id} className="timeline-item relative">
                                                <div className="timeline-line"></div>
                                                <div className={`absolute -left-[56px] top-2 w-12 h-12 rounded-full border-4 border-white shadow-lg z-10 flex items-center justify-center ${plan.isStatic || plan.type==='fixed' ? 'bg-pink-400' : 'bg-[#9D76C1]'} shadow-purple-100`}>
                                                    <Icon name={plan.type==='fixed' ? 'plane' : 'heart'} size={20} className="text-white fill-white/20" />
                                                </div>
                                                <div className="chic-card p-8 border-l-[12px]" style={{ borderLeftColor: plan.isStatic||plan.type==='fixed' ? '#FF91C1' : '#9D76C1' }}>
                                                    <div className="flex justify-between items-start mb-3">
                                                        <span className="text-base font-bold text-slate-300 tracking-widest">{plan.time}</span>
                                                        <div className="flex gap-4">
                                                            <button onClick={(e) => { e.stopPropagation(); setEditingPlan(plan); setEditPlanBuffer({time:plan.time, title:plan.title, type:plan.type}); setIsEditingPlan(true); }} className="text-slate-200 hover:text-purple-400 active:scale-75 transition-all"><Icon name="pencil" size={20}/></button>
                                                            {!plan.isStatic && <button onClick={(e) => { e.stopPropagation(); setIsConfirmModal({show:true, id:plan.id}); }} className="text-slate-200 hover:text-red-400 active:scale-75 transition-all"><Icon name="trash" size={20}/></button>}
                                                        </div>
                                                    </div>
                                                    <h3 className="text-3xl font-black text-slate-700 leading-tight mb-6">{plan.title}</h3>
                                                    <button onClick={() => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(plan.title)}`, '_blank')} className="flex items-center gap-2 font-bold text-purple-500 bg-purple-50 px-5 py-2.5 rounded-2xl active:scale-95 transition-all border border-purple-100"><Icon name="navigation" size={18}/> 查看位置</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { setEditingPlan(null); setEditPlanBuffer({time:'', title:'', type: 'attraction'}); setIsEditingPlan(true); }} className="w-full bg-white border-4 border-dashed border-purple-100 text-purple-300 py-10 rounded-[40px] flex items-center justify-center gap-4 active:bg-purple-50 transition-all font-black text-3xl shadow-sm"><Icon name="plus" size={32} /> 新增計畫</button>
                                </div>
                            )
                        )}

                        {/* 2. 地圖分頁 */}
                        {activeTab === 'map' && (
                            <div className="space-y-10 animate-in fade-in duration-500">
                                <h2 className="text-3xl font-black text-slate-800 italic flex items-center gap-3"><span className="w-2 h-8 kuromi-gradient rounded-full"></span>全家收藏 📍</h2>
                                <button onClick={() => window.open('https://maps.app.goo.gl/3yBGjjqpevzTECGB9', '_blank')} className="w-full bg-[#2D2727] text-white p-12 rounded-[50px] shadow-2xl flex items-center justify-between border-4 border-white/10 active:scale-95 transition-all group">
                                    <div className="text-left space-y-2">
                                        <p className="text-4xl font-black text-white group-hover:text-pink-300 transition-colors">開啟地圖</p>
                                        <p className="text-[11px] font-bold opacity-40 uppercase tracking-[0.3em] text-white italic">Fukuoka Saved List 💜</p>
                                    </div>
                                    <div className="bg-chic-purple p-6 rounded-full shadow-lg shadow-purple-500/30"><Icon name="navigation" size={36} className="text-white" /></div>
                                </button>
                                <div className="bg-white p-12 rounded-[50px] border-4 border-purple-50 italic font-bold text-purple-300 text-xl text-center leading-relaxed shadow-sm">
                                    點擊上方按鈕<br/>查看我幫全家人<br/>整理好的福岡熱點 💜
                                </div>
                            </div>
                        )}

                        {/* 3. 記帳分頁 */}
                        {activeTab === 'expense' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                {/* 支出統計卡片 */}
                                <div className="expense-card-dark text-white p-12 rounded-[60px] shadow-2xl space-y-8 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-10 opacity-[0.05] rotate-12 scale-150"><Icon name="coins" size={200}/></div>
                                    <div className="space-y-1 relative z-10">
                                        <p className="text-[11px] font-black uppercase tracking-[0.4em] text-pink-400">總支出統計</p>
                                        <p className="text-7xl font-black tracking-tighter mb-1">¥{totalExpenseJpy.toLocaleString()}</p>
                                        <p className="text-2xl font-bold text-pink-300 opacity-80">≈ NT$ {totalExpenseTwd.toLocaleString()}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-8 pt-8 border-t border-white/5 relative z-10">
                                        {members.map(m => {
                                            const pTotal = expenses.filter(e => e.payer === m).reduce((s, e) => s + (e.amount || 0), 0);
                                            return (
                                                <div key={m} className="space-y-1"><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{m} 支付</span><p className="text-xl font-black text-slate-100">¥{pTotal.toLocaleString()}</p></div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white rounded-[50px] p-10 space-y-10 shadow-xl border-4 border-purple-50 relative overflow-hidden">
                                    <div className="absolute -top-10 -left-10 w-40 h-40 bg-purple-50/50 rounded-full blur-3xl"></div>
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 relative z-10"><Icon name="wallet" className="text-pink-400" />快速記帳</h3>
                                    <div className="space-y-8 relative z-10">
                                        <div className="flex items-center gap-5 border-b-4 border-slate-50 pb-5 focus-within:border-purple-200 transition-colors">
                                            <span className="text-4xl font-black opacity-20 w-12 text-center text-purple-900">¥</span>
                                            <input type="number" value={fxJpy} onChange={(e) => { setFxJpy(e.target.value); setFxTwd(e.target.value ? Math.round(e.target.value * exchangeRate) : ''); }} placeholder="0" className="flex-1 bg-transparent text-6xl font-black focus:outline-none placeholder:text-slate-100 tracking-tighter" />
                                        </div>
                                        <div className="flex items-center gap-5 pt-3">
                                            <span className="text-4xl font-black text-pink-300 w-12 text-center">$</span>
                                            <input type="number" value={fxTwd} onChange={(e) => { setFxTwd(e.target.value); setFxJpy(e.target.value ? Math.round(e.target.value / exchangeRate) : ''); }} placeholder="0" className="flex-1 bg-transparent text-6xl font-black text-pink-300 focus:outline-none placeholder:text-pink-50 tracking-tighter" />
                                        </div>
                                    </div>
                                    <button onClick={addExpense} disabled={isSaving || !fxJpy} className="w-full btn-gradient text-white py-6 rounded-[35px] font-black text-2xl shadow-xl active:scale-95 disabled:opacity-30 relative z-10">同步至雲端帳單 💜</button>
                                </div>

                                <div className="space-y-5 pb-16">
                                    {expenses.map(ex => (
                                        <div key={ex.id} className="chic-card p-7 flex justify-between items-center border-l-[16px] border-chic-purple transition-all active:scale-95 shadow-sm">
                                            <div className="flex-1 mr-4 space-y-1">
                                                <div className="flex items-center gap-3 mb-2"><span className="text-[10px] font-black text-white bg-slate-800 px-3 py-1 rounded-lg uppercase tracking-wider">{ex.payer}</span><span className="text-[10px] text-slate-300 font-bold tracking-widest">{ex.date}</span></div>
                                                <p className="text-2xl font-black text-slate-700 leading-tight">{ex.item}</p>
                                            </div>
                                            <div className="text-right flex items-center gap-6">
                                                <div className="space-y-0.5">
                                                    <p className="text-3xl font-black text-slate-800 leading-none">¥{ex.amount?.toLocaleString()}</p>
                                                    <p className="text-[11px] font-black text-pink-400 uppercase tracking-tighter">NT$ {ex.amountTwd?.toLocaleString()}</p>
                                                </div>
                                                <button onClick={() => db.collection(`artifacts/${appId}/public/data/expenses`).doc(ex.id).delete()} className="p-3 bg-red-50 text-red-400 rounded-full active:scale-75 transition-all"><Icon name="trash" size={24}/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. 工具分頁 */}
                        {activeTab === 'tools' && (
                            <div className="space-y-12 animate-in fade-in pb-28">
                                <section>
                                    <div className="flex items-center gap-5 chic-card p-10 mb-10 border-b-[15px] border-chic-orange shadow-2xl relative overflow-hidden">
                                        <div className="absolute right-0 top-0 opacity-5 rotate-45 scale-150"><Icon name="ticket" size={150} /></div>
                                        <div className="p-5 bg-orange-100 rounded-[30px] text-chic-orange shadow-inner"><Icon name="ticket" size={48} /></div>
                                        <p className="text-3xl font-black text-slate-800 tracking-tighter">優惠專區 📂</p>
                                    </div>
                                    <div className="space-y-6">
                                        {couponList.map((c, i) => (
                                            <div key={i} onClick={() => window.open(c.link, '_blank')} className="chic-card p-8 flex items-center justify-between active:bg-orange-50 cursor-pointer group transition-all">
                                                <div className="flex items-center gap-6"><Icon name="folder" size={32} className="text-orange-200 group-hover:text-orange-400 transition-colors" /><span className="font-bold text-2xl text-slate-600 tracking-tight">{c.category}</span></div>
                                                <Icon name="chevron-right" size={32} className="text-slate-200" />
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <div className="chic-card p-12 border-[8px] border-purple-50 text-center relative overflow-hidden bg-white shadow-2xl">
                                    <Icon name="hotel" size={60} className="text-purple-100 mx-auto mb-6" />
                                    <h3 className="text-3xl font-black text-slate-800 mb-2 leading-tight tracking-tighter">博多西鐵 CROOM 🏨</h3>
                                    <p className="text-[11px] text-slate-400 font-black mb-12 uppercase tracking-[0.4em]">博多祇園櫛田神社前站</p>
                                    <div className="flex gap-6"><button onClick={() => window.open('https://maps.app.goo.gl/hotel','_blank')} className="flex-1 btn-gradient text-white py-6 rounded-[35px] font-black text-xl shadow-xl active:scale-95 transition-all text-white">地圖導航</button><a href="tel:092-235-0311" className="flex-1 border-4 border-slate-900 py-6 rounded-[35px] font-black text-xl text-slate-900 flex items-center justify-center active:scale-95 transition-all">撥打電話</a></div>
                                </div>

                                <section>
                                    <div className="flex items-center gap-4 mb-10 px-2 italic underline decoration-pink-100 decoration-8 underline-offset-[-4px]"><Icon name="luggage" size={32} className="text-purple-400" /><h3 className="text-3xl font-black text-slate-800 tracking-tighter">快速資源入口 💜</h3></div>
                                    <div className="grid grid-cols-2 gap-8 px-1">
                                        <button onClick={() => window.open('https://vjw-lp.digital.go.jp/','_blank')} className="chic-card p-10 flex flex-col items-center justify-center gap-5 active:scale-95 transition-all shadow-xl border-b-[12px] border-blue-400">
                                            <div className="w-18 h-18 bg-blue-50 rounded-full flex items-center justify-center text-blue-400 shadow-inner"><Icon name="refresh" size={36}/></div>
                                            <span className="font-black text-base text-slate-500 uppercase tracking-widest">VJW 入境</span>
                                        </button>
                                        <button onClick={() => window.open('https://photos.google.com','_blank')} className="chic-card p-10 flex flex-col items-center justify-center gap-5 active:scale-95 transition-all shadow-xl border-b-[12px] border-pink-400">
                                            <div className="w-18 h-18 bg-pink-50 rounded-full flex items-center justify-center text-pink-400 shadow-inner"><Icon name="image" size={36}/></div>
                                            <span className="font-black text-base text-slate-500 uppercase tracking-widest">共享相簿</span>
                                        </button>
                                    </div>
                                </section>

                                <section className="space-y-6 pb-20">
                                    <h3 className="text-2xl font-black text-slate-800 px-2 italic">行李檢查清單 💼</h3>
                                    {['護照/身分證/VJW QR碼', '日幣/信用卡/保險單', '換洗衣物/好走的鞋', '相機/行動電源/充電線', 'Ruby 藥品/尿布/副食品'].map(item => (
                                        <div key={item} onClick={() => setPackingItems(prev => ({...prev, [item]: !prev[item]}))} className={`chic-card p-7 flex items-center gap-6 transition-all active:scale-95 cursor-pointer shadow-sm ${packingItems[item] ? 'opacity-40 grayscale bg-slate-50' : ''}`}>
                                            <div className={`w-10 h-10 rounded-2xl border-4 flex items-center justify-center transition-all ${packingItems[item] ? 'bg-purple-400 border-transparent' : 'border-purple-50'}`}>
                                                {packingItems[item] && <Icon name="check" className="text-white" size={24} />}
                                            </div>
                                            <span className={`font-bold text-xl text-slate-600 ${packingItems[item] ? 'line-through' : ''}`}>{item}</span>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                    </div>

                    {/* 天氣預報 Modal */}
                    {isWeatherModalOpen && (
                        <div className="fixed inset-0 z-[120] modal-mask flex items-center justify-center p-6">
                            <div className="bg-white/95 w-full rounded-[60px] p-12 shadow-2xl space-y-8 animate-in slide-in-from-bottom duration-300 max-h-[85vh] overflow-y-auto hide-scrollbar border-b-[20px] border-chic-purple">
                                <div className="flex justify-between items-center mb-6"><h3 className="text-4xl font-black text-slate-800 italic underline decoration-chic-purple decoration-4 underline-offset-4">福岡週報 🌦️</h3><button onClick={() => setIsWeatherModalOpen(false)} className="p-4 text-slate-300 active:scale-75 transition-all"><Icon name="x" size={40} /></button></div>
                                <div className="space-y-6">{(forecast || []).map((f, i) => (<div key={i} className="flex items-center justify-between p-8 bg-slate-50 rounded-[45px] shadow-sm"><div className="flex items-center gap-6"><span className="text-2xl font-black text-slate-400 w-20 tracking-tighter">{f.date}</span><Icon name="cloud-sun" size={40} className="text-chic-purple opacity-80" /></div><div className="flex items-center gap-5"><span className="text-4xl font-black text-slate-700 leading-none">{f.max}°</span><div className="w-px h-10 bg-slate-200"></div><span className="text-4xl font-black text-slate-300 leading-none">{f.min}°</span></div></div>))}</div>
                                <button onClick={() => setIsWeatherModalOpen(false)} className="w-full btn-gradient text-white py-8 rounded-[40px] font-black text-3xl shadow-2xl mt-6 active:scale-95 transition-all">關閉 💜</button>
                            </div>
                        </div>
                    )}

                    {/* 編輯計畫 Modal */}
                    {isEditingPlan && (
                        <div className="fixed inset-0 z-[110] modal-mask flex items-center justify-center p-6">
                            <div className="bg-white/95 w-full rounded-[60px] p-12 shadow-2xl space-y-12 animate-in zoom-in border-t-[20px] border-chic-purple">
                                <h3 className="text-4xl font-black text-slate-800 text-center kuromi-font tracking-tight">{editingPlan ? '修改計畫 ✏️' : '新增計畫 ✏️'}</h3>
                                <div className="space-y-10 text-left">
                                    <div className="space-y-6">
                                        <label className="text-sm font-black text-slate-400 ml-6 uppercase tracking-[0.4em] block">預計時間 (如 14:30)</label>
                                        <input value={editPlanBuffer.time} onChange={(e) => setEditPlanBuffer({...editPlanBuffer, time: e.target.value})} className="w-full bg-slate-50 rounded-[40px] p-8 text-5xl font-black border-4 border-transparent focus:border-purple-100 outline-none transition-all shadow-inner text-center tracking-tighter" />
                                        <label className="text-sm font-black text-slate-400 ml-6 uppercase tracking-[0.4em] block">計畫內容</label>
                                        <input value={editPlanBuffer.title} onChange={(e) => setEditPlanBuffer({...editPlanBuffer, title: e.target.value})} className="w-full bg-slate-50 rounded-[40px] p-8 text-3xl font-black border-4 border-transparent focus:border-purple-100 outline-none transition-all shadow-inner" />
                                    </div>
                                </div>
                                <div className="flex gap-6 pt-4">
                                    <button onClick={savePlan} disabled={isSaving} className="flex-1 btn-gradient text-white py-8 rounded-[40px] font-black text-3xl shadow-2xl active:scale-95 transition-all">{isSaving ? "同步中..." : "確認儲存"}</button>
                                    <button onClick={() => { setIsEditingPlan(false); setEditingPlan(null); }} className="px-12 bg-slate-100 text-slate-400 rounded-[40px] font-black active:scale-95 transition-all text-xl">取消</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <div className="fixed bottom-0 left-0 right-0 h-4 kuromi-gradient z-[60]"></div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
